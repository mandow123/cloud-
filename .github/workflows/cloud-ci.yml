name: Cloud application checks
on:
  pull_request:
    branches: [codex/cloud-stable]
  push:
    branches: [codex/cloud-stable, codex/cloud-fix-release-governance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloud-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    name: application
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run ops:self-test
      - run: npm run ops:deploy:validate
      - name: Record exact validated revision
        run: |
          printf 'Validated commit: `%s`\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
