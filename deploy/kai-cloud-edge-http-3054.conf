worker_processes auto;
pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  # OAuth callbacks carry one-time code/state values in the query string.
  # Log only the normalized path plus non-query request metadata.
  log_format kai_edge '$remote_addr [$time_iso8601] $request_method $uri $status $body_bytes_sent';
  access_log /dev/stdout kai_edge;
  server_tokens off;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  map $http_upgrade $kai_connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 172.31.31.78:3054 default_server;
    server_name cloud.kai.com;

    client_max_body_size 256k;
    keepalive_timeout 65s;

    location / {
      proxy_pass http://127.0.0.1:3051;
      proxy_http_version 1.1;

      # 3054 is private and firewall-restricted to the AWS VPC ingress path.
      # Never trust forwarding metadata supplied by the downstream request.
      proxy_set_header Host cloud.kai.com;
      proxy_set_header X-Forwarded-Host cloud.kai.com;
      proxy_set_header X-Forwarded-Port 443;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Forwarded "";
      proxy_set_header X-Forwarded-Server "";

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $kai_connection_upgrade;
      proxy_connect_timeout 5s;
      proxy_send_timeout 75s;
      proxy_read_timeout 75s;
    }
  }
}
