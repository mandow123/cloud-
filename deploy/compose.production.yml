services:
  app:
    image: "${KAI_IMAGE:?KAI_IMAGE must be an immutable repository@sha256 digest}"
    pull_policy: always
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    environment:
      NODE_ENV: production
      KAI_ENVIRONMENT: LIVE
      HOST: 0.0.0.0
      PORT: "3000"
      KAI_DB_DIR: /app/db
      KAI_MARKET_DATA_DIR: /app/market
      KAI_RELEASE_SHA: "${KAI_RELEASE_SHA:?KAI_RELEASE_SHA is required}"
      KAI_IMAGE_REFERENCE: "${KAI_IMAGE:?KAI_IMAGE must be an immutable repository@sha256 digest}"
      KAI_TRUST_PROXY: "1"
      KAI_REQUIRE_HTTPS_WRITES: "1"
      KAI_ENABLE_HSTS: "${KAI_ENABLE_HSTS:-0}"
      KAI_PUBLIC_ORIGIN: "${KAI_PUBLIC_ORIGIN:?KAI_PUBLIC_ORIGIN must be the canonical https origin}"
      KAI_CURSOR_SECRET: "${KAI_CURSOR_SECRET:?KAI_CURSOR_SECRET must contain at least 32 random characters}"
      KAI_ADMIN_USERNAME: "${KAI_ADMIN_USERNAME:?KAI_ADMIN_USERNAME is required}"
      KAI_ADMIN_PASSWORD_HASH: "${KAI_ADMIN_PASSWORD_HASH:?KAI_ADMIN_PASSWORD_HASH is required}"
      KAI_ADMIN_DISPLAY_NAME: "${KAI_ADMIN_DISPLAY_NAME:-KAI Cloud Root}"
      KAI_ADMIN_APPROVER_USERNAME: "${KAI_ADMIN_APPROVER_USERNAME:-}"
      KAI_ADMIN_APPROVER_PASSWORD_HASH: "${KAI_ADMIN_APPROVER_PASSWORD_HASH:-}"
      KAI_ADMIN_APPROVER_DISPLAY_NAME: "${KAI_ADMIN_APPROVER_DISPLAY_NAME:-KAI Cloud Finance Approver}"
      KAI_ACCOUNT_OIDC_CLIENT_ID: "${KAI_ACCOUNT_OIDC_CLIENT_ID:-}"
      KAI_ACCOUNT_OIDC_CLIENT_SECRET: "${KAI_ACCOUNT_OIDC_CLIENT_SECRET:-}"
      KAI_ACCOUNT_OIDC_ISSUER: "${KAI_ACCOUNT_OIDC_ISSUER:-}"
      KAI_ACCOUNT_OIDC_SCOPES: "${KAI_ACCOUNT_OIDC_SCOPES:-}"
      KAI_ACCOUNT_OIDC_TRANSACTION_SECRET: "${KAI_ACCOUNT_OIDC_TRANSACTION_SECRET:-}"
      KAI_MANUAL_DELIVERY_INTAKE: "${KAI_MANUAL_DELIVERY_INTAKE:-0}"
      KAI_BUY_CATALOG_V2: "${KAI_BUY_CATALOG_V2:-0}"
      KAI_ACCOUNT_CONSOLE_V2: "${KAI_ACCOUNT_CONSOLE_V2:-0}"
      KAI_DGX_SPARK_CAMPAIGN_ENABLED: "${KAI_DGX_SPARK_CAMPAIGN_ENABLED:-0}"
      KAI_DGX_SPARK_CAMPAIGN_STATUS: "${KAI_DGX_SPARK_CAMPAIGN_STATUS:-PENDING}"
      KAI_DGX_SPARK_SUPPLIER_REVIEW_STATUS: "${KAI_DGX_SPARK_SUPPLIER_REVIEW_STATUS:-PENDING}"
      KAI_DGX_SPARK_TOTAL_UNITS: "${KAI_DGX_SPARK_TOTAL_UNITS:-}"
      KAI_DGX_SPARK_DISCOUNT_PERCENT: "${KAI_DGX_SPARK_DISCOUNT_PERCENT:-}"
      KAI_DGX_SPARK_COUNTDOWN_SECONDS: "${KAI_DGX_SPARK_COUNTDOWN_SECONDS:-}"
      KAI_DGX_SPARK_ESTIMATED_SHIPPING_MONTHS: "${KAI_DGX_SPARK_ESTIMATED_SHIPPING_MONTHS:-}"
      KAI_DGX_SPARK_PRICE_CARD_HOURS_MICROS: "${KAI_DGX_SPARK_PRICE_CARD_HOURS_MICROS:-}"
      KAI_DGX_SPARK_PURCHASE_PATH: "${KAI_DGX_SPARK_PURCHASE_PATH:-}"
      KAI_HOSTING_V2: "${KAI_HOSTING_V2:-0}"
      KAI_HOSTING_V2_SETUP: "${KAI_HOSTING_V2_SETUP:-0}"
      KAI_HOSTING_DEVICE_RETIREMENT: "${KAI_HOSTING_DEVICE_RETIREMENT:-0}"
      KAI_HOSTING_APPROVED_IMAGES: "${KAI_HOSTING_APPROVED_IMAGES:-}"
      KAI_HOSTING_TERMS_VERSION: "${KAI_HOSTING_TERMS_VERSION:-}"
      KAI_ADMIN_LOCAL_AUTH: "0"
      KAI_ALIPAY_ENABLED: "${KAI_ALIPAY_ENABLED:-0}"
      KAI_ALIPAY_APP_ID: "${KAI_ALIPAY_APP_ID:-}"
      KAI_ALIPAY_PRIVATE_KEY: "${KAI_ALIPAY_PRIVATE_KEY:-}"
      KAI_ALIPAY_PRIVATE_KEY_TYPE: "${KAI_ALIPAY_PRIVATE_KEY_TYPE:-PKCS8}"
      KAI_ALIPAY_PUBLIC_KEY: "${KAI_ALIPAY_PUBLIC_KEY:-}"
      KAI_ALIPAY_SELLER_ID: "${KAI_ALIPAY_SELLER_ID:-}"
      KAI_ALIPAY_GATEWAY: "${KAI_ALIPAY_GATEWAY:-https://openapi.alipay.com/gateway.do}"
      KAI_SUPPLY_OPS_TOKEN: "${KAI_SUPPLY_OPS_TOKEN:-}"
      KAI_SSH_PROVISIONER_URL: "${KAI_SSH_PROVISIONER_URL:-}"
      KAI_SSH_PROVISIONER_TOKEN: "${KAI_SSH_PROVISIONER_TOKEN:-}"
    ports:
      - "127.0.0.1:${KAI_APP_PORT:-3051}:3000"
    volumes:
      - type: bind
        source: "${KAI_STATE_ROOT:-/opt/kai-cloud-3051}/db"
        target: /app/db
      - type: bind
        source: "${KAI_STATE_ROOT:-/opt/kai-cloud-3051}/market"
        target: /app/market
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/live || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  market-update:
    profiles: ["ops"]
    image: "${KAI_IMAGE:?KAI_IMAGE must be an immutable repository@sha256 digest}"
    pull_policy: always
    restart: "no"
    init: true
    user: "1000:1000"
    read_only: true
    environment:
      KAI_MARKET_DATA_DIR: /app/market
      KAI_MARKET_PENDING_PATH: /app/market/model-market.pending.json
      KAI_MARKET_SNAPSHOT_PATH: /app/market/model-market.snapshot.json
      KAI_MARKET_REGISTRY_PATH: /app/market-registry/model-market-registry.mjs
    volumes:
      - type: bind
        source: "${KAI_STATE_ROOT:-/opt/kai-cloud-3051}/market"
        target: /app/market
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    command: ["node", "scripts/model-market/cli.mjs", "update"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  backup:
    profiles: ["ops"]
    image: "${KAI_IMAGE:?KAI_IMAGE must be an immutable repository@sha256 digest}"
    pull_policy: always
    restart: "no"
    init: true
    network_mode: none
    user: "1000:1000"
    read_only: true
    environment:
      KAI_DB_DIR: /app/db
      KAI_MARKET_DATA_DIR: /app/market
      KAI_BACKUP_DIR: /app/backups
      KAI_RELEASE_SHA: "${KAI_RELEASE_SHA:?KAI_RELEASE_SHA is required}"
      KAI_BACKUP_RETENTION_HOURLY: "${KAI_BACKUP_RETENTION_HOURLY:-48}"
      KAI_BACKUP_RETENTION_DAILY: "${KAI_BACKUP_RETENTION_DAILY:-30}"
      KAI_BACKUP_RETENTION_MONTHLY: "${KAI_BACKUP_RETENTION_MONTHLY:-0}"
      KAI_BACKUP_RETENTION_MAX_AGE_DAYS: "${KAI_BACKUP_RETENTION_MAX_AGE_DAYS:-30}"
    volumes:
      - type: bind
        source: "${KAI_STATE_ROOT:-/opt/kai-cloud-3051}/db"
        target: /app/db
      - type: bind
        source: "${KAI_STATE_ROOT:-/opt/kai-cloud-3051}/market"
        target: /app/market
        read_only: true
      - type: bind
        source: "${KAI_STATE_ROOT:-/opt/kai-cloud-3051}/backups"
        target: /app/backups
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    mem_reservation: 64m
    cpus: 0.5
    command: ["node", "scripts/ops/backup-marketplace.mjs", "create"]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
