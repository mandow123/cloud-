# Optional third overlay for the reviewed payment pilot only.
# Apply after compose.stabilization.yml. The production validator rejects any
# checkout unless KAI_PAYMENT_PILOT_ENABLED is explicitly set to 1.
services:
  app:
    environment:
      KAI_PAYMENT_PILOT_ENABLED: "${KAI_PAYMENT_PILOT_ENABLED:?KAI_PAYMENT_PILOT_ENABLED must be explicitly set to 1}"
      KAI_ALIPAY_ENABLED: "${KAI_ALIPAY_ENABLED:-0}"
      KAI_ALIPAY_RECONCILIATION_ENABLED: "${KAI_ALIPAY_RECONCILIATION_ENABLED:-0}"
      KAI_ALIPAY_APPROVAL_REFERENCE: "${KAI_ALIPAY_APPROVAL_REFERENCE:-}"
      KAI_ALIPAY_CREDENTIAL_ROTATED_AT: "${KAI_ALIPAY_CREDENTIAL_ROTATED_AT:-}"
      KAI_ALIPAY_CREDENTIAL_VERSION: "${KAI_ALIPAY_CREDENTIAL_VERSION:-}"
      KAI_ALIPAY_PILOT_ORGANIZATIONS: "${KAI_ALIPAY_PILOT_ORGANIZATIONS:-}"
      KAI_QIXIANG_PAY_ENABLED: "${KAI_QIXIANG_PAY_ENABLED:-0}"
      KAI_QIXIANG_PAY_RECONCILIATION_ENABLED: "${KAI_QIXIANG_PAY_RECONCILIATION_ENABLED:-0}"
