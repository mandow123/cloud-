workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

stages:
  - validate
variables:
  GIT_DEPTH: "0"
  KAI_COMPOSE_BIN: ".market-cache/tools/docker-compose"

validate:cloud-source:
  image: node:24.18.0-bookworm-slim
  stage: validate
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends python3 git ca-certificates
    - node scripts/ops/install-compose-checker.mjs
  script:
    - npm ci
    - npm run lint
    - npm test
    - npm run ops:self-test
    - npm run ops:deploy:validate
